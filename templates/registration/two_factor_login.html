{% extends "base.html" %}

{% block title %}Two-factor verification{% endblock %}

{% block shell %}
<main class="public-main">
  <h1>Two-factor verification</h1>
  <p>Enter the code from your authenticator app or a backup code.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Verify</button>
  </form>
</main>
{% endblock %}
