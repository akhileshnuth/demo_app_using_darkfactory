# CI is the merge authority: the factory opens PRs, this check plus human
# review decides them. Keep it required in branch protection.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: factory contract
        run: node scripts/verify-factory-contract.mjs
